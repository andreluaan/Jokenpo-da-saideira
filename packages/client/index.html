<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jokenpô da Saideira</title>
  </head>
  <body>
    <!-- Carregamento: o copo enche enquanto os modelos 3D chegam -->
    <section id="loading" class="screen">
      <div class="load-card">
        <div class="glass"><div id="loading-bar" class="beer"></div><div class="foam"></div></div>
        <p id="loading-msg">Gelando a cerveja…</p>
      </div>
    </section>

    <!-- Tela inicial: cardápio de boteco sobre o quintal em 3D -->
    <section id="menu" class="screen hidden">
      <div id="menu-bg"></div>
      <!-- Coluna da esquerda: lousa e, logo embaixo, o card do personagem -->
      <div class="menu-col">
      <aside class="menu-card" id="menu-side">
        <div class="plaque">
          <span class="plaque-top">Bar do Zé apresenta</span>
          <h1 class="logo">JOKENPÔ <span>da Saideira</span></h1>
        </div>
        <p class="tagline">Uma gelada só. Quem ficar de pé leva.</p>

        <label class="field">
          <span class="chalk">Apelido</span>
          <input id="nickname" maxlength="16" autocomplete="off" placeholder="Como te chamam no bar?" />
        </label>

        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-mode="training">🤖 Treino</button>
          <button type="button" class="tab" data-mode="online">🍻 Online</button>
        </div>

        <!-- Treino local contra NPCs -->
        <div id="mode-training">
          <div class="row">
            <label class="field">
              <span class="chalk">Adversários</span>
              <select id="bot-count">
                <option value="1">1 NPC</option>
                <option value="2">2 NPCs</option>
                <option value="3" selected>3 NPCs</option>
              </select>
            </label>
            <label class="field">
              <span class="chalk">Dificuldade</span>
              <select id="difficulty">
                <option value="easy">Fácil</option>
                <option value="normal" selected>Normal</option>
                <option value="hard">Difícil</option>
              </select>
            </label>
          </div>
          <button id="start-training" class="btn primary">🍺 Disputar a gelada</button>
        </div>

        <!-- Online: salas com código -->
        <div id="mode-online" class="hidden">
          <div id="online-out">
            <button id="room-create" class="btn primary">🍻 Abrir uma mesa (criar sala)</button>
            <div class="join-row">
              <input id="room-code" maxlength="4" autocomplete="off" placeholder="CÓDIGO" />
              <button id="room-join" class="btn">Sentar na mesa</button>
            </div>
          </div>
          <div id="online-in" class="hidden">
            <div class="room-head">
              <div><span class="chalk">Mesa</span> <b id="room-code-label" class="room-code"></b></div>
              <button id="room-copy" class="btn small ghost" type="button">Copiar código</button>
            </div>
            <ul id="room-players"></ul>
            <div class="row" id="room-host-settings">
              <label class="field">
                <span class="chalk">NPCs na mesa</span>
                <select id="room-bots">
                  <option value="0">Nenhum</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>
              </label>
              <label class="field">
                <span class="chalk">Dificuldade</span>
                <select id="room-difficulty">
                  <option value="easy">Fácil</option>
                  <option value="normal">Normal</option>
                  <option value="hard">Difícil</option>
                </select>
              </label>
            </div>
            <button id="room-ready" class="btn primary">Estou pronto</button>
            <button id="room-start" class="btn primary">🍺 Começar a disputa</button>
            <button id="room-leave" class="btn small ghost" type="button">Levantar da mesa (sair)</button>
          </div>
          <p id="online-status" class="note"></p>
        </div>

        <button id="howto-open" class="btn howto-btn" type="button">📖 Como jogar</button>
      </aside>

      <!-- Personagem escolhido: card no canto (troca pelas setas ou clicando nele na mesa) -->
      <aside id="char-spot" class="char-spot"></aside>
      </div>

      <!-- Como jogar: cards com imagem, um passo de cada vez -->
      <div id="howto" class="howto-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="howto-title">
        <div class="howto-card">
          <button id="howto-close" class="howto-x" type="button" aria-label="Fechar">✕</button>
          <div class="howto-pic"><img id="howto-img" alt="" /></div>
          <div class="howto-text">
            <span id="howto-step" class="howto-step"></span>
            <h2 id="howto-title"></h2>
            <p id="howto-body"></p>
            <div id="howto-keys" class="howto-keys"></div>
          </div>
          <div class="howto-nav">
            <button id="howto-prev" class="btn ghost" type="button">‹ Voltar</button>
            <div id="howto-dots" class="howto-dots"></div>
            <button id="howto-next" class="btn primary" type="button">Próximo ›</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Partida: 3D em tela cheia, HUD por cima -->
    <section id="match" class="screen hidden">
      <div id="game-wrap"></div>
      <header id="player-cards"></header>
      <button id="leave" class="leave-btn" tabindex="-1" title="Sair para o menu">✕ Sair</button>
      <footer id="action-bar">
        <div id="hint"></div>
        <div class="bar">
          <button class="act" data-act="challenge" tabindex="-1">🤜 Desafiar<kbd>Espaço</kbd></button>
          <span class="sep"></span>
          <button class="sym" data-sym="rock" tabindex="-1"><span class="ico"></span>Pedra<kbd>1</kbd></button>
          <button class="sym" data-sym="paper" tabindex="-1"><span class="ico"></span>Papel<kbd>2</kbd></button>
          <button class="sym" data-sym="scissors" tabindex="-1"><span class="ico"></span>Tesoura<kbd>3</kbd></button>
          <span class="sep"></span>
          <button class="act" data-act="dash" tabindex="-1">Investida<kbd>Shift</kbd></button>
          <button class="act" data-act="drink" tabindex="-1">🍺 Beber<kbd>E</kbd></button>
        </div>
      </footer>

      <div id="end-overlay" class="hidden">
        <div class="end-card">
          <h2 id="end-title"></h2>
          <p id="end-sub"></p>
          <div class="row center">
            <button id="play-again" class="btn primary">Jogar novamente</button>
            <button id="to-menu" class="btn ghost">Menu</button>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
